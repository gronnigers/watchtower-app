<script>try{var _t=localStorage.getItem("wt_theme");if(_t==="dark"||_t==="light")document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#f4f6fa; --sfc:#ffffff; --ink:#16202e; --mut:#6b7688; --bd:#e7ebf1;
    --teal:#0d8f86; --teald:#0a6a63; --tealw:#e2f2f0;
    --crit:#d64545; --critw:#fbe7e7; --warn:#b9770a; --warnw:#fbefd8;
    --info:#3a6fd4; --infow:#e6edfb; --ok:#2c8a5b; --okw:#e0f0e7;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0d1219; --sfc:#141c26; --ink:#eaf0f7; --mut:#8593a5; --bd:#26313f;
    --teal:#2bc0b4; --teald:#57d3c8; --tealw:#123029;
    --crit:#f2696b; --critw:#331a1c; --warn:#e0a63c; --warnw:#2f2410;
    --info:#6c9bf0; --infow:#141f33; --ok:#54c188; --okw:#122a1e;
  }}
  :root[data-theme="dark"]{
    --bg:#0d1219; --sfc:#141c26; --ink:#eaf0f7; --mut:#8593a5; --bd:#26313f;
    --teal:#2bc0b4; --teald:#57d3c8; --tealw:#123029;
    --crit:#f2696b; --critw:#331a1c; --warn:#e0a63c; --warnw:#2f2410;
    --info:#6c9bf0; --infow:#141f33; --ok:#54c188; --okw:#122a1e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
    background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
  #app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column}

  .topbar{padding:calc(12px + var(--safe-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:-.01em}
  .brand .lg{color:var(--teal)}
  .gear{width:34px;height:34px;border-radius:10px;background:var(--sfc);border:1px solid var(--bd);display:grid;place-items:center;color:var(--mut);font-size:15px;cursor:pointer}

  .view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px 20px}
  .view::-webkit-scrollbar{width:0}

  /* zen */
  .zen{display:flex;flex-direction:column;align-items:center;padding:10px 0 2px}
  .ring{position:relative;width:210px;height:210px;display:grid;place-items:center}
  .ring svg{position:absolute;inset:0}
  .ring .num{font-size:68px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .ring .cap{font-size:12.5px;color:var(--mut);margin-top:3px}
  .zen .head{font-size:18px;font-weight:600;margin-top:18px;text-align:center}
  .zen .said{font-size:13px;color:var(--mut);max-width:32ch;text-align:center;margin-top:4px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px}
  .tile{background:var(--sfc);border:1px solid var(--bd);border-radius:16px;padding:15px;cursor:pointer;text-align:left;transition:transform .12s}
  .tile:active{transform:scale(.97)}
  .tile .n{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .tile .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-family:"IBM Plex Mono",monospace;margin-top:7px}

  .lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:24px 2px 10px;font-weight:600}

  .alert{display:flex;gap:11px;background:var(--sfc);border:1px solid var(--bd);border-radius:15px;padding:13px 14px;position:relative;overflow:hidden;cursor:pointer;transition:transform .12s}
  .alert:active{transform:scale(.98)}
  .alert+.alert{margin-top:10px}
  .alert.ack{opacity:.55}
  .alert .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .alert .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
  .alert .tx{flex:1;min-width:0}
  .alert .tt{font-weight:600;font-size:13.5px;letter-spacing:-.005em;line-height:1.3}
  .alert .st{font-size:12px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .alert .tm{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--mut);flex:none;padding-top:3px}
  .alert .chev{color:var(--mut);font-size:16px;align-self:center;opacity:.5}
  .bg-crit{background:var(--crit)} .bg-warn{background:var(--warn)} .bg-info{background:var(--info)} .bg-ok{background:var(--ok)}
  .c-crit{color:var(--crit)} .c-warn{color:var(--warn)} .c-info{color:var(--info)} .c-ok{color:var(--ok)}

  .banner{border-radius:17px;padding:16px;display:flex;gap:13px;align-items:center}
  .banner .mk{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;flex:none}
  .banner .bt{font-weight:700;font-size:15px} .banner .bs{font-size:12px;color:var(--mut)}

  .seg{display:flex;background:var(--sfc);border:1px solid var(--bd);border-radius:11px;padding:3px;gap:2px;margin-bottom:14px}
  .seg div{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--mut);padding:7px 0;border-radius:8px;cursor:pointer}
  .seg div.on{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--bd)}

  .pushcard{background:var(--tealw);border:1px solid var(--bd);border-radius:15px;padding:15px 16px;margin-top:14px;display:flex;align-items:center;gap:13px}
  .pushcard .tx{flex:1}
  .pushcard .tt{font-weight:600;font-size:14px}
  .pushcard .ss{font-size:12px;color:var(--mut);margin-top:2px}

  .btn{display:block;width:100%;text-align:center;font-weight:600;font-size:14px;border-radius:12px;padding:13px;border:none;cursor:pointer;transition:transform .12s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn.solid{background:var(--teal);color:#fff} .btn.small{width:auto;padding:10px 16px;font-size:13px}
  .btn.ghost{background:var(--sfc);border:1.5px solid var(--bd);color:var(--ink)}
  .btn.danger{background:var(--crit);color:#fff}
  .field{width:100%;font-family:"IBM Plex Mono",monospace;font-size:13px;padding:12px 13px;border:1px solid var(--bd);border-radius:11px;background:var(--sfc);color:var(--ink);margin-top:6px}
  .flabel{font-size:12px;font-weight:600;color:var(--ink);margin-top:16px;display:block}
  .fhint{font-size:11.5px;color:var(--mut);margin-top:3px}

  /* detail */
  .dhead{display:flex;align-items:center;gap:11px;padding:6px 0 12px}
  .back{width:34px;height:34px;border-radius:10px;background:var(--sfc);border:1px solid var(--bd);display:grid;place-items:center;font-size:17px;color:var(--ink);cursor:pointer;flex:none}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px}
  .dtitle{font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
  .dmeta{font-size:12px;color:var(--mut);margin-top:4px}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-top:16px}
  .facts .f{background:var(--sfc);padding:12px 13px}
  .facts .fl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
  .facts .fv{font-weight:600;font-size:13px;margin-top:3px;word-break:break-word}
  .why{background:var(--sfc);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin-top:16px;font-size:12.5px;color:var(--ink);line-height:1.55}
  .why b{color:var(--teal)}
  .actbar{display:flex;gap:9px;margin-top:18px}

  .empty{text-align:center;color:var(--mut);padding:40px 20px}
  .empty .big{font-size:34px;margin-bottom:8px}
  .spinner{width:26px;height:26px;border:3px solid var(--bd);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  .tabbar{display:flex;justify-content:space-around;align-items:center;padding:10px 6px calc(14px + var(--safe-bot));border-top:1px solid var(--bd);background:var(--sfc)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--mut);font-weight:600;cursor:pointer;padding:2px 10px;position:relative}
  .tab.on{color:var(--teal)}
  .tab svg{width:23px;height:23px}
  .tab .cnt{position:absolute;top:-3px;right:6px;background:var(--crit);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px}

  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(12px);bottom:calc(90px + var(--safe-bot));background:#151d29;color:#eaf0f7;border-radius:13px;padding:12px 16px;font-size:13px;z-index:50;opacity:0;transition:.28s;pointer-events:none;max-width:88%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* connect screen */
  .connect{max-width:400px;height:100%;overflow-y:auto;overscroll-behavior:contain;margin:0 auto;padding:calc(40px + var(--safe-top)) 22px 40px}
  .connect .logo{width:64px;height:64px;border-radius:18px;background:var(--teal);display:grid;place-items:center;color:#fff;font-size:30px;margin-bottom:18px}
  .connect h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  .connect p{color:var(--mut);font-size:14px;margin:0 0 8px}

  /* geo watch */
  .map{position:relative;border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin-top:4px;
      background-color:var(--sfc);
      background-image:radial-gradient(120% 120% at 50% -10%, color-mix(in srgb, var(--teal) 8%, var(--sfc)), var(--sfc))}
  .map svg{display:block;width:100%;height:auto}
  .dots{fill:var(--teal);opacity:.5;filter:drop-shadow(0 0 .7px var(--teal))}
  .arc{fill:none;stroke-width:.5;opacity:.5;stroke-linecap:round}
  .arc-crit{stroke:var(--crit)} .arc-warn{stroke:var(--warn)} .arc-info{stroke:var(--info)} .arc-ok{stroke:var(--teal)}
  .home-dot{fill:var(--teal);filter:drop-shadow(0 0 1.2px var(--teal))}
  .pin-halo{opacity:.26}
  .pin-core{filter:drop-shadow(0 0 1.4px currentColor)}
  .pin-hit{fill:transparent;cursor:pointer}
  .pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{opacity:.55;r:2.4}70%{opacity:0;r:9}100%{opacity:0;r:9}}
  .mapcap{position:absolute;left:12px;bottom:9px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);opacity:.8}
  .geolist{margin-top:16px}
  .rbadge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;font-family:"IBM Plex Mono",monospace;letter-spacing:.03em;text-transform:uppercase}

  /* attacks */
  .actrls{display:flex;gap:8px;margin:2px 0 11px}
  .miniseg{display:flex;background:var(--sfc);border:1px solid var(--bd);border-radius:11px;padding:3px;gap:2px;flex:1}
  .miniseg button{flex:1;border:none;background:none;color:var(--mut);font-size:12px;font-weight:600;padding:7px 4px;border-radius:8px;cursor:pointer;font-family:inherit}
  .miniseg button.on{background:var(--teal);color:#052b28}
  .miniseg.mode button.on{background:var(--warn);color:#3a2600}
  .amap{position:relative;border:1px solid var(--bd);border-radius:16px;overflow:hidden;background-color:var(--sfc);
      background-image:radial-gradient(120% 130% at 50% -5%, color-mix(in srgb, var(--teal) 9%, var(--sfc)), var(--sfc))}
  .amap canvas{display:block;width:100%}
  .amap .cap{position:absolute;left:12px;top:11px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
  .amap .lb{position:absolute;right:11px;top:10px;display:flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.06em;color:var(--teal)}
  .amap .lb .d{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal);animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .scrub{margin-top:11px;background:var(--sfc);border:1px solid var(--bd);border-radius:13px;padding:9px 12px;display:flex;align-items:center;gap:11px}
  .play{width:34px;height:34px;border-radius:9px;background:var(--warn);color:#3a2600;border:none;font-size:14px;cursor:pointer;flex:none;display:grid;place-items:center}
  .track{position:relative;flex:1}
  .track canvas{display:block;width:100%;height:36px;cursor:pointer}
  .tlabel{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--mut);min-width:66px;text-align:right}
  .astats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
  .astat{background:var(--sfc);border:1px solid var(--bd);border-radius:13px;padding:11px 12px}
  .astat .n{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .astat .l{font-size:9px;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;font-family:"IBM Plex Mono",monospace}
  .afeed{display:flex;flex-direction:column;gap:7px;min-height:52px;margin-top:8px}
  .af{display:flex;align-items:center;gap:9px;background:var(--sfc);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;animation:slidein .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes slidein{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
  .af .ic{font-size:12px;flex:none}
  .af .ip{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink)}
  .af .loc{font-size:11.5px;color:var(--mut);margin-left:auto;white-space:nowrap}
  .af .tag{font-family:"IBM Plex Mono",monospace;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:999px;flex:none}
  .tag-block{background:rgba(43,182,166,.14);color:var(--teal)}
  .tag-risk{background:rgba(255,176,32,.16);color:var(--warn)}
  .tag-crit{background:rgba(255,90,106,.16);color:var(--crit)}
</style>

async function loadConfig(){
  try{ const r = await fetch("/api/config"); if(r.ok){ const c = await r.json(); rt.vapidPublic = c.vapidPublic || null; } }catch(_){}

// ---------- theme (light / dark / system) ----------
const THEME_KEY = "wt_theme";
let theme = (function(){ try{ return localStorage.getItem(THEME_KEY) || "system"; }catch(_){ return "system"; } })();
function applyTheme(t){
  const r = document.documentElement;
  if (t === "dark" || t === "light") r.setAttribute("data-theme", t);
  else r.removeAttribute("data-theme");
}
applyTheme(theme);

let state = { screen:"home", detail:null, filter:null, alerts:[], loading:false, pushOn:false };

// ---------- helpers ----------
function api(path){ return `/api/${path}`; }
function timeAgo(iso){
  const s = Math.floor((Date.now()-Date.parse(iso))/1000);
  if(s<60) return "now"; if(s<3600) return Math.floor(s/60)+"m";
  if(s<86400) return Math.floor(s/3600)+"h"; return Math.floor(s/86400)+"d";
}
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),5000); }
function sevClass(s){ return s==="critical"?"crit":s==="warning"?"warn":s==="info"?"info":"ok"; }
function open(a){ return (a.state||"open")==="open"; }

async function fetchAlerts(silent){
  if(!silent){ state.loading=true; render(); }
  try{
    const res = await fetch(api("alerts"));
    if(!res.ok) throw new Error("API "+res.status);
    const data = await res.json();
    state.alerts = data.alerts||[];
  }catch(e){ if(!silent) toast("Couldn't reach the API — try again"); }
  state.loading=false; render();
}

async function ack(a, kind){
  try{
    await fetch(api("ack"),{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({partitionKey:a.partitionKey,rowKey:a.rowKey,kind})});
    a.state = kind==="safe"?"safe":"acknowledged";
    toast(kind==="safe"?"Marked safe":"Acknowledged");
    state.screen="home"; render();
  }catch(e){ toast("Couldn't update — try again"); }
}

// ---------- push ----------
function urlB64ToUint8(base64){
  const pad="=".repeat((4-base64.length%4)%4);
  const b=(base64+pad).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(b); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i); return arr;
}
async function enablePush(){
  if(!("serviceWorker" in navigator)){ toast("No service worker support"); return; }
  if(!("PushManager" in window)){ toast("Push not supported (needs iOS 16.4+ installed PWA)"); return; }
  let perm;
  try{ perm = await Notification.requestPermission(); }
  catch(e){ toast("Permission error: "+e.message); return; }
  if(perm!=="granted"){ toast("Notifications not granted ("+perm+")"); return; }

  let reg;
  try{ reg = await navigator.serviceWorker.ready; }
  catch(e){ toast("SW not ready: "+e.message); return; }

  if(!rt.vapidPublic){ toast("Push key still loading — try again in a sec"); return; }
  let key;
  try{ key = urlB64ToUint8((rt.vapidPublic||"").trim()); }
  catch(e){ toast("Push key problem — check VAPID_PUBLIC on the backend"); return; }

  let sub;
  try{
    sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:key });
  }catch(e){ toast("Subscribe failed: "+(e.name||"")+" — "+(e.message||"")); return; }

  try{
    const res = await fetch(api("push/subscribe"),{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(sub)});
    if(!res.ok){ toast("Save failed: API returned "+res.status); return; }
  }catch(e){ toast("Save failed (network): "+e.message); return; }

  state.pushOn=true; toast("Alerts on — this device is subscribed"); render();
}
async function checkPush(){
  try{ const reg=await navigator.serviceWorker.ready; const s=await reg.pushManager.getSubscription(); state.pushOn=!!s; }catch(_){}
}

// ---------- views ----------
function homeView(){
  const openAlerts = state.alerts.filter(open);
  const needs = openAlerts.filter(a=>a.severity==="critical"||a.severity==="warning").length;
  const quiet = needs===0;
  const ringColor = quiet? "var(--ok)":"var(--warn)";
  const circ = 2*Math.PI*84;
  const frac = quiet?1:Math.max(.28,1-needs*0.16);
  const off = circ*(1-frac);
  const cats=[["admin","Admin changes"],["signin","Sign-in flags"],["risk","Risky users"],["defender","Defender"]];
  const tiles = cats.map(([k,l])=>{
    const c = openAlerts.filter(a=>a.category===k).length;
    const crit = openAlerts.some(a=>a.category===k&&a.severity==="critical");
    return `<button class="tile" data-tile="${k}"><div class="n ${crit?'c-crit':(c>0?'c-warn':'')}">${c}</div><div class="l">${l}</div></button>`;
  }).join("");
  const latest = openAlerts[0];
  const latestHtml = latest
    ? `<div class="lbl">Latest</div>${alertRow(latest)}`
    : "";
  const pushHtml = state.pushOn ? "" :
    `<div class="pushcard"><div class="tx"><div class="tt">Turn on alerts</div><div class="ss">Get a push the moment something trips.</div></div><button class="btn solid small" id="pushBtn">Enable</button></div>`;
  return `
    <div class="topbar"><div class="brand"><span class="lg">◆</span> Watchtower</div><div class="gear" data-nav="settings">⚙</div></div>
    <div class="view">
      <div class="zen"><div class="ring">
        <svg viewBox="0 0 210 210"><circle cx="105" cy="105" r="84" fill="none" stroke="var(--bd)" stroke-width="9"/>
          <circle cx="105" cy="105" r="84" fill="none" stroke="${ringColor}" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${circ.toFixed(1)}" transform="rotate(-90 105 105)"
            style="transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)" data-ring="${off.toFixed(1)}"/></svg>
        <div style="text-align:center"><div class="num ${quiet?'c-ok':''}">${needs}</div><div class="cap">${quiet?'all clear':'need you'}</div></div>
      </div>
      <div class="head">${quiet?'All quiet':(needs===1?'One thing to check':needs+' things to check')}</div>
      <div class="said">${quiet?'Nothing open needs your attention right now.':'Tap a tile or an alert to dig in.'}</div></div>
      ${pushHtml}
      <div class="tiles">${tiles}</div>
      ${latestHtml}
    </div>`;
}

function placeOf(a){
  const p=[a.city,a.country].filter(Boolean).join(", ");
  return p||"unknown location";
}
function subtitleOf(a){
  if(a.category==="signin"){
    return esc(placeOf(a))+(a.actor?' · '+esc(a.actor):'');
  }
  if(a.category==="risk"){
    return esc(a.actor||'')+(placeOf(a)!=='unknown location'?' · '+esc(placeOf(a)):'');
  }
  return esc(a.target||'')+(a.actor?' · by '+esc(a.actor):'');
}
function alertRow(a){
  const sc = sevClass(a.severity);
  return `<div class="alert ${open(a)?'':'ack'}" data-alert="${a.rowKey}">
    <span class="bar bg-${sc}"></span><span class="dot bg-${sc}"></span>
    <div class="tx"><div class="tt">${esc(a.title)}</div><div class="st">${subtitleOf(a)}</div></div>
    <span class="tm">${a.createdUtc?timeAgo(a.createdUtc):''}</span><span class="chev">›</span></div>`;
}

  const chips=[["","All"],["admin","Admin"],["signin","Sign-ins"],["defender","Defender"],["risk","Risk"]].map(([k,l])=>
    `<div class="${(f||'')===k?'on':''}" data-filter="${k}">${l}</div>`).join("");
  const rows = list.length? list.map(alertRow).join("")
    : `<div class="empty"><div class="big">✓</div>No alerts in this view</div>`;
  return `
    <div class="topbar"><div class="brand"><span class="lg">◆</span> Alerts</div><div class="gear" data-nav="settings">⚙</div></div>
    <div class="view"><div class="seg">${chips}</div>${rows}</div>`;
}

// equirectangular projection: x = lon+180 (0..360), y = 90-lat (0..180).
// Cropped to the populated latitude band so poles aren't stretched.
const LAT_TOP = 80, LAT_BOT = -56;                 // matches the baked dot grid
const Y_TOP = 90 - LAT_TOP, Y_BOT = 90 - LAT_BOT;
const MAP_H = Y_BOT - Y_TOP;
const MAP_VB = `0 ${Y_TOP} 360 ${MAP_H}`;
const HOME = { lon: -97.74, lat: 30.27 };          // Austin — home base
function projX(lon){ return (lon+180); }
function projY(lat){ return (90-lat); }

// The dot-matrix continents are static — build the SVG once and cache it.
let _dotField = null;
function dotField(){
  if(_dotField !== null) return _dotField;
  let s = "";
  for(const p of WORLD_DOTS.split(" ")){
    const c = p.indexOf(",");
    s += `<circle cx="${p.slice(0,c)}" cy="${p.slice(c+1)}" r=".55"/>`;
  }
  _dotField = `<g class="dots">${s}</g>`;
  return _dotField;
}

// A lifted quadratic arc between two points (the "connection" line look).
function arcPath(x1,y1,x2,y2){
  const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1;
  const cx=mx - dy*0.28, cy=my + dx*0.28;
  return `M${x1.toFixed(1)} ${y1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}

function worldMap(pins){
  const hx=projX(HOME.lon), hy=projY(HOME.lat);

  // arcs from home to every located pin, colored by severity
  let arcs="";
  pins.forEach(a=>{
    const x=projX(a.lon), y=projY(a.lat);
    arcs += `<path class="arc arc-${sevClass(a.severity)}" d="${arcPath(hx,hy,x,y)}"/>`;
  });

  // pins (newest first → pins[0] pulses)
  let dots="";
  pins.forEach((a,i)=>{
    const x=projX(a.lon).toFixed(1), y=projY(a.lat).toFixed(1);
    const sc=sevClass(a.severity);
    const col=`var(--${sc})`;
    const pulse=i===0?`<circle cx="${x}" cy="${y}" r="2.4" fill="${col}" class="pin-halo pulse"/>`:"";
    dots+=`${pulse}
      <circle cx="${x}" cy="${y}" r="4.8" fill="${col}" class="pin-halo"/>
      <circle cx="${x}" cy="${y}" r="2.2" fill="${col}" class="pin-core" style="color:${col}"/>
      <circle cx="${x}" cy="${y}" r="9" class="pin-hit" data-alert="${a.rowKey}"/>`;
  });

  const homeDot = `<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="1.5" class="home-dot"/>`;

  return `<div class="map"><svg viewBox="${MAP_VB}" preserveAspectRatio="xMidYMid meet">${dotField()}${arcs}${homeDot}${dots}</svg>
    <div class="mapcap">${pins.length} located${pins.length?' · newest pulsing':''}</div></div>`;
}

function geoView(){
  const sis = state.alerts.filter(a=>a.category==="signin");
  const open_ = sis.filter(open);
  const pins = sis.filter(a=>typeof a.lat==="number" && typeof a.lon==="number");

    return `${header}

  const summary = open_.length

    : `<div class="said" style="margin:12px 2px 2px">All flagged sign-ins handled.</div>`;

  return `${header}
    <div class="view">

const ATK = {
  win:"24h", mode:"live", data:[], since:0, tnow:0, top:"—", total:0, uniq:0,
  raf:null, mapC:null, mapX:null, W:0, H:0, dot:null, dpr:Math.min(2,window.devicePixelRatio||1),
  arcs:[], liveAcc:0, last:0, playN:0, playing:true, lastN:0,
  trackC:null, trackX:null, TW:0, TH:36, buckets:[], poll:null, loading:false, dotsArr:null,

  parseDots(){ if(this.dotsArr) return; this.dotsArr = WORLD_DOTS.split(" ").map(p=>{const c=p.indexOf(",");return [parseFloat(p.slice(0,c)),parseFloat(p.slice(c+1))];}); },
  px(lon){ return (lon+180)/360*this.W; },
  py(lat){ return ((90-lat)-Y_TOP)/(Y_BOT-Y_TOP)*this.H; },
  buildDot(){ const oc=document.createElement("canvas"); oc.width=this.W*this.dpr; oc.height=this.H*this.dpr; const x=oc.getContext("2d"); x.scale(this.dpr,this.dpr); x.fillStyle="rgba(43,182,166,.42)"; for(const p of this.dotsArr){ const px=p[0]/360*this.W, py=(p[1]-Y_TOP)/(Y_BOT-Y_TOP)*this.H; x.fillRect(px-0.5,py-0.5,1.05,1.05);} this.dot=oc; },
  size(){ const r=this.mapC.parentElement.getBoundingClientRect(); this.W=r.width; this.mapC.style.height=Math.round(this.W*(Y_B_H())/360)+"px"; const rr=this.mapC.getBoundingClientRect(); this.H=rr.height; this.mapC.width=this.W*this.dpr; this.mapC.height=this.H*this.dpr; this.mapX.setTransform(this.dpr,0,0,this.dpr,0,0); this.buildDot(); },

  init(){
    this.parseDots();
    if(this.raf){ cancelAnimationFrame(this.raf); this.raf=null; }
    if(this.poll){ clearInterval(this.poll); this.poll=null; }
    this.mapC=$("atkMap"); if(!this.mapC) return; this.mapX=this.mapC.getContext("2d");
    this.trackC=$("atkTrack"); this.trackX=this.trackC?this.trackC.getContext("2d"):null;
    this.size(); this.arcs=[]; this.last=0;
    // wire controls
    $("atkWin").onclick=(e)=>{const b=e.target.closest("button"); if(b) this.setWin(b.dataset.w);};
    $("atkMode").onclick=(e)=>{const b=e.target.closest("button"); if(b) this.setMode(b.dataset.m);};
    const pl=$("atkPlay"); if(pl) pl.onclick=()=>{ this.playing=!this.playing; pl.textContent=this.playing?'⏸':'▶'; };
    if(this.trackC){ this.sizeTrack();
      this.trackC.onpointerdown=(e)=>{ this._drag=true; this.scrubTo(e.clientX); this.trackC.setPointerCapture(e.pointerId); };
      this.trackC.onpointermove=(e)=>{ if(this._drag) this.scrubTo(e.clientX); };
      this.trackC.onpointerup=()=>{ this._drag=false; };
    }
    this.renderStats();
    if(!this.data.length || this._loadedWin!==this.win) this.fetch();
    else this.computeBuckets();
    if(this.mode==="live") this.startPoll();
    this.raf=requestAnimationFrame((t)=>this.frame(t));
  },

  startPoll(){ if(this.poll) clearInterval(this.poll); this.poll=setInterval(()=>{ if(this.mode==="live" && state.screen==="attacks" && !document.hidden) this.fetch(true); }, 45000); },

  async fetch(silent){
    this.loading=!silent; const cap=$("atkCap"); if(cap && !silent) cap.textContent=(this.mode==="live"?"Live · ":"Replay · ")+this.win+" · loading…";
    try{
      const res=await fetch(api("attacks?window="+this.win));
      const d=await res.json();
      if(d && d.ok){ this._loadedWin=this.win; this.since=Date.parse(d.since); this.tnow=Date.now();
        this.total=d.total||0; this.uniq=d.uniqueIps||0; this.top=d.topOrigin||"—";
        this.data=(d.points||[]).map(p=>({ ...p, ms:Date.parse(p.t) }));
        const span=Math.max(1,this.tnow-this.since);
        this.data.forEach(p=>p.tn=Math.max(0,Math.min(1,(p.ms-this.since)/span)));
        this.data.sort((a,b)=>a.tn-b.tn);
        this.computeBuckets(); this.renderStats();
      }
    }catch(e){}
    this.loading=false; const c2=$("atkCap"); if(c2) c2.textContent=(this.mode==="live"?"Live · ":"Replay · ")+this.win;
  },

  renderStats(){ const s1=$("as1"),s2=$("as2"),s3=$("as3"),sl=$("asl"); if(!s1) return;
    s1.textContent=this.total.toLocaleString(); s2.textContent=this.uniq.toLocaleString(); s3.textContent=this.top?this.top.split(",")[0]:"—"; if(sl) sl.textContent="Blocked · "+this.win; },

  setWin(w){ if(w===this.win) return; this.win=w; document.querySelectorAll("#atkWin button").forEach(b=>b.classList.toggle("on",b.dataset.w===w));
    this.playN=0; this.lastN=0; this.arcs=[]; const f=$("atkFeed"); if(f) f.innerHTML=""; const sl=$("asl"); if(sl) sl.textContent="Blocked · "+w;
    this.fetch(); },
  setMode(m){ if(m===this.mode) return; this.mode=m; document.querySelectorAll("#atkMode button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
    const sc=$("atkScrub"); if(sc) sc.hidden=(m!=="replay"); const lb=$("atkLive"); if(lb) lb.style.display=(m==="live")?"flex":"none";
    const fh=$("atkFeedHead"); if(fh) fh.textContent=(m==="live")?"Live feed":"Replay feed"; const cap=$("atkCap"); if(cap) cap.textContent=(m==="live"?"Live · ":"Replay · ")+this.win;
    const f=$("atkFeed"); if(f) f.innerHTML=""; this.arcs=[]; this.playN=0; this.lastN=0; this.playing=true; const pl=$("atkPlay"); if(pl) pl.textContent='⏸';
    if(m==="replay"){ setTimeout(()=>{ this.sizeTrack(); this.computeBuckets(); this.drawTrack(); },20); this.stopPoll(); }
    else this.startPoll();
  },
  stopPoll(){ if(this.poll){ clearInterval(this.poll); this.poll=null; } },

  fireArc(p){ const x1=this.px(p.lon), y1=this.py(p.lat), x2=this.px(HOME.lon), y2=this.py(HOME.lat);
    const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1, cx=mx-dy*0.3, cy=my+dx*0.3;
    const c = p.sev==="crit"?css2("--crit"):p.sev==="risk"?css2("--warn"):css2("--teal");
    this.arcs.push({x1,y1,cx,cy,x2,y2,t0:performance.now(),dur:1600+Math.random()*600,c}); },
  addFeed(p){ const feed=$("atkFeed"); if(!feed) return; const cls=p.sev==="crit"?"tag-crit":p.sev==="risk"?"tag-risk":"tag-block"; const tag=p.sev==="crit"?"malicious":p.sev==="risk"?"risky":"blocked"; const c=p.sev==="crit"?"var(--crit)":p.sev==="risk"?"var(--warn)":"var(--teal)";
    const row=document.createElement("div"); row.className="af"; const loc=[p.city,p.country].filter(Boolean).join(", ")||"unknown";
    row.innerHTML=`<span class="ic" style="color:${c}">✕</span><span class="ip">${esc(p.ip||"—")}</span><span class="tag ${cls}">${tag}</span><span class="loc">${esc(loc)}</span>`;
    feed.prepend(row); while(feed.children.length>6) feed.removeChild(feed.lastChild); },

  sizeTrack(){ if(!this.trackC) return; const r=this.trackC.getBoundingClientRect(); this.TW=r.width; this.trackC.width=this.TW*this.dpr; this.trackC.height=this.TH*this.dpr; this.trackX.setTransform(this.dpr,0,0,this.dpr,0,0); },
  computeBuckets(){ this.buckets=new Array(60).fill(0); this.data.forEach(p=>this.buckets[Math.min(59,Math.floor(p.tn*60))]++); },
  drawTrack(){ if(!this.TW||!this.trackX) return; this.trackX.clearRect(0,0,this.TW,this.TH); const mx=Math.max(1,...this.buckets); const bw=this.TW/60;
    this.buckets.forEach((v,i)=>{ const h=(v/mx)*(this.TH-8); this.trackX.fillStyle="rgba(43,182,166,.35)"; this.trackX.fillRect(i*bw+0.5,this.TH-3-h,bw-1,h); });
    const px=this.playN*this.TW; this.trackX.strokeStyle=css2("--warn"); this.trackX.lineWidth=1.4; this.trackX.beginPath(); this.trackX.moveTo(px,0); this.trackX.lineTo(px,this.TH); this.trackX.stroke();
    this.trackX.fillStyle=css2("--warn"); this.trackX.beginPath(); this.trackX.arc(px,2,2.6,0,7); this.trackX.fill(); },
  scrubTo(clientX){ const r=this.trackC.getBoundingClientRect(); let n=(clientX-r.left)/r.width; n=Math.max(0,Math.min(1,n)); this.playing=false; const pl=$("atkPlay"); if(pl) pl.textContent='▶'; this.lastN=n; this.playN=n; this.drawTrack(); const tl=$("atkTlabel"); if(tl) tl.textContent=this.fmtAgo((this.tnow-this.since)*(1-n)); },
  fmtAgo(ms){ const s=ms/1000; if(s<90) return "now"; const m=s/60; if(m<90) return Math.round(m)+"m ago"; const h=m/60; if(h<40) return Math.round(h)+"h ago"; return Math.round(h/24)+"d ago"; },

  frame(now){
    if(state.screen!=="attacks" || !this.mapX){ this.raf=null; return; }
    const dt=Math.min(0.05,(now-(this.last||now))/1000); this.last=now;
    const x=this.mapX; x.clearRect(0,0,this.W,this.H); x.drawImage(this.dot,0,0,this.W,this.H);
    if(this.mode==="live"){ if(this.data.length){ this.liveAcc+=dt; if(this.liveAcc>0.8){ this.liveAcc=0; const lo=Math.floor(this.data.length*0.6); const p=this.data[lo+Math.floor(Math.random()*(this.data.length-lo))]||this.data[this.data.length-1]; this.fireArc(p); this.addFeed(p); } } }
    else { if(this.playing && this.data.length){ this.playN+=dt/14; if(this.playN>1){ this.playN=0; this.lastN=0; } }
      for(const p of this.data){ if(p.tn>this.lastN && p.tn<=this.playN){ this.fireArc(p); if(Math.random()<0.5) this.addFeed(p); } }
      this.lastN=this.playN; this.drawTrack(); const tl=$("atkTlabel"); if(tl) tl.textContent=this.fmtAgo((this.tnow-this.since)*(1-this.playN)); }
    const tx=this.px(HOME.lon), ty=this.py(HOME.lat);
    for(let i=this.arcs.length-1;i>=0;i--){ const a=this.arcs[i]; const p=(now-a.t0)/a.dur; if(p>1.4){ this.arcs.splice(i,1); continue; }
      const head=Math.min(1,p); x.lineWidth=1.1; x.strokeStyle=a.c; x.globalAlpha=Math.max(0,1-Math.max(0,p-0.5)/0.85)*0.8;
      x.beginPath(); for(let k=0;k<=24;k++){ const tt=head*k/24,u=1-tt; const qx=u*u*a.x1+2*u*tt*a.cx+tt*tt*a.x2, qy=u*u*a.y1+2*u*tt*a.cy+tt*tt*a.y2; k?x.lineTo(qx,qy):x.moveTo(qx,qy);} x.stroke();
      if(p<=1){ const u=1-head, hx=u*u*a.x1+2*u*head*a.cx+head*head*a.x2, hy=u*u*a.y1+2*u*head*a.cy+head*head*a.y2; x.globalAlpha=1; x.fillStyle=a.c; x.beginPath(); x.arc(hx,hy,1.9,0,7); x.fill(); }
      else { const rp=(p-1)/0.4; x.globalAlpha=(1-rp)*0.8; x.strokeStyle=a.c; x.lineWidth=1; x.beginPath(); x.arc(tx,ty,3+rp*8,0,7); x.stroke(); } }
    x.globalAlpha=1; const pu=0.6+0.4*Math.sin(now/500); x.fillStyle=css2("--teal"); x.globalAlpha=.3; x.beginPath(); x.arc(tx,ty,3.2+pu*1.5,0,7); x.fill(); x.globalAlpha=1; x.beginPath(); x.arc(tx,ty,2.4,0,7); x.fill();
    this.raf=requestAnimationFrame((t)=>this.frame(t));
  }
};
function Y_B_H(){ return (Y_BOT-Y_TOP); }
function css2(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||"#2bb6a6"; }

function tabs(){
  if(state.screen==="detail"||state.screen==="settings"||state.screen==="connect") return "";
  const openCount = state.alerts.filter(open).length;
  const ic={
    home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    geo:'<path d="M12 21s-7-6.5-7-11a7 7 0 0114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    attacks:'<circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
    alerts:'<path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.5 21a2 2 0 01-3 0"/>'
  };
  const t=(k,l)=>`<div class="tab ${state.screen===k?'on':''}" data-nav="${k}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg>
    <span>${l}</span>${k==='alerts'&&openCount?`<span class="cnt">${openCount}</span>`:''}</div>`;
  return `<div class="tabbar">${t("home","Home")}${t("geo","Sign-ins")}${t("attacks","Attacks")}${t("alerts","Alerts")}</div>`;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  // leaving the attacks tab? stop its animation loop + polling.
  if(state.screen!=="attacks"){ if(ATK.raf){ cancelAnimationFrame(ATK.raf); ATK.raf=null; } ATK.stopPoll(); }
  let body;
  if(state.loading && state.screen==="home") body=`<div class="topbar"><div class="brand"><span class="lg">◆</span> Watchtower</div></div><div class="spinner"></div>`;
  else if(state.screen==="home") body=homeView();
  else if(state.screen==="alerts") body=alertsView();
  else if(state.screen==="geo") body=geoView();
  else if(state.screen==="attacks") body=attacksView();
  else if(state.screen==="detail") body=detailView();
  else if(state.screen==="settings") body=settingsView();
  app.innerHTML = body + tabs();
  // animate ring
  const ring=app.querySelector("[data-ring]");
  if(ring) requestAnimationFrame(()=>requestAnimationFrame(()=>ring.setAttribute("stroke-dashoffset",ring.getAttribute("data-ring"))));
  wire();
  if(state.screen==="attacks") ATK.init();
}

function wire(){
  app.querySelectorAll("[data-nav]").forEach(el=>el.onclick=()=>{ state.screen=el.getAttribute("data-nav"); state.filter=null; render(); });
  app.querySelectorAll("[data-tile]").forEach(el=>el.onclick=()=>{ state.screen="alerts"; state.filter=el.getAttribute("data-tile"); render(); });
  app.querySelectorAll("[data-filter]").forEach(el=>el.onclick=()=>{ state.filter=el.getAttribute("data-filter")||null; render(); });
  app.querySelectorAll("[data-alert]").forEach(el=>el.onclick=()=>{ state.detail=el.getAttribute("data-alert"); state.screen="detail"; render(); });
  app.querySelectorAll("[data-back]").forEach(el=>el.onclick=()=>{ state.screen="home"; render(); });
  app.querySelectorAll("[data-ack]").forEach(el=>el.onclick=()=>{ const a=state.alerts.find(x=>x.rowKey===state.detail); if(a) ack(a, el.getAttribute("data-ack")); });
  const pb=$("pushBtn"); if(pb) pb.onclick=enablePush;
  const tp=$("testPush"); if(tp) tp.onclick=enablePush;
  app.querySelectorAll("[data-theme-opt]").forEach(el=>el.onclick=()=>{
    theme=el.getAttribute("data-theme-opt");
    try{ localStorage.setItem(THEME_KEY, theme); }catch(_){}
    applyTheme(theme); render();
  });
}

// ---------- boot ----------
if("serviceWorker" in navigator){ navigator.serviceWorker.register("/sw.js").catch(()=>{}); }
render();
loadConfig().then(()=>{ checkPush().then(()=>{ fetchAlerts(); }); });

// Keep the dashboard fresh: refetch when the app opens/regains focus (e.g. tapping
// a push), and quietly every 60s while it's in the foreground.
// (the Attacks tab manages its own data + animation; don't re-render over it)
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && state.screen!=="attacks") fetchAlerts(true); });
window.addEventListener("focus", ()=>{ if(state.screen!=="attacks") fetchAlerts(true); });
setInterval(()=>{ if(!document.hidden && state.screen!=="attacks") fetchAlerts(true); }, 60000);
</script>
